[package]
name = "rn-std"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rustynail standard libraries: base, string, table, math, io, os, coroutine, utf8, debug, package"
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
jit = ["rn-core/jit"]
jit_counter_b = ["rn-core/jit_counter_b"]
jit_check_d = ["rn-core/jit_check_d"]
jit_counter_g = ["rn-core/jit_counter_g"]
jit_counter_c = ["rn-core/jit_counter_c"]
jit_check_e = ["rn-core/jit_check_e"]
jit_no_loop = ["rn-core/jit_no_loop"]
jit_no_entry = ["rn-core/jit_no_entry"]

[dependencies]
rn-core = { path = "../rn-core" }
rn-compiler = { path = "../rn-compiler" }
libc = "0.2"
